[project]
name = "sage"
version = "1.0.0"
description = "Claude-style long-context reasoning assistant"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "BLE"]
# B008: FastAPI's `Depends(...)` in argument defaults is idiomatic, not a bug.
# UP037: SQLAlchemy models use string forward refs (Mapped[list["Document"]]).
ignore = ["B008", "UP037"]

[tool.black]
line-length = 100
target-version = ["py311"]
